<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - FREEDOM PLUS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background: #0b0b0d; color: #fff; padding: 30px; }
        h1 { color: #00ffcc; margin-bottom: 20px; }
        .card { background: #16161a; padding: 20px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #aaa; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px; }
        button { background: #00ffcc; color: #121214; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button:hover { background: #00e6b8; }
    </style>
</head>
<body>
    <h1>👑 Admin Dashboard (ระบบจัดการหลังบ้านจริง)</h1>
    
    <div class="card">
        <h3>➕ เพิ่มเกมใหม่เข้าระบบ</h3>
        <div class="form-group" style="margin-top: 10px;">
            <label>ชื่อเกมหลัก</label>
            <input type="text" id="game-title" placeholder="เช่น LINE">
        </div>
        <div class="form-group">
            <label>ชื่อรอง / ประเภท</label>
            <input type="text" id="game-sub" placeholder="เช่น Rangers">
        </div>
        <button onclick="addNewGame()">บันทึกเกมลง MongoDB</button>
    </div>

    <script>
        const BACKEND_URL = "https://freedom-backend-z4az.onrender.com";

        async function addNewGame() {
            const title = document.getElementById('game-title').value;
            const sub = document.getElementById('game-sub').value;

            if(!title) return alert("กรุณากรอกชื่อเกม");

            try {
                let res = await fetch(`${BACKEND_URL}/api/admin/games`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, sub })
                });
                let data = await res.json();
                if(res.ok) {
                    alert("✅ เพิ่มเกมลงฐานข้อมูล MongoDB สำเร็จ!");
                    location.reload();
                } else {
                    alert("❌ เกิดข้อผิดพลาด: " + data.error);
                }
            } catch(err) {
                alert("❌ ไม่สามารถเชื่อมต่อ Server ได้");
            }
        }
    </script>
</body>
</html>
