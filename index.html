<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREEDOM PLUS - Admin Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #218838; }
        .hidden { display: none; }
        .log-box { background: #e9ecef; padding: 10px; border-radius: 5px; margin-top: 15px; font-size: 14px; color: #333; }
        .error { color: red; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้าล็อกอิน -->
    <div id="login-section">
        <h2>Admin Login</h2>
        <div class="form-group">
            <label>รหัสผ่านแอดมิน (ค่าเริ่มต้น: admin123)</label>
            <input type="password" id="admin-pass" placeholder="กรอกรหัสผ่าน">
        </div>
        <button onclick="adminLogin()">เข้าสู่ระบบ</button>
        <div id="login-error" class="error"></div>
    </div>

    <!-- หน้าจัดการหลังบ้าน (ซ่อนไว้จนกว่าจะล็อกอินผ่าน) -->
    <div id="admin-dashboard" class="hidden">
        <h2>ระบบจัดการหลังบ้าน (FREEDOM PLUS)</h2>
        <div class="log-box" id="last-login-log">
            กำลังโหลดข้อมูลการเข้าสู่ระบบล่าสุด...
        </div>

        <hr style="margin: 20px 0;">

        <h3>เปลี่ยนรหัสผ่านแอดมิน</h3>
        <div class="form-group">
            <label>รหัสผ่านใหม่</label>
            <input type="password" id="new-admin-pass" placeholder="กรอกรหัสผ่านใหม่ที่ต้องการ">
        </div>
        <button onclick="changePassword()" style="background-color: #007bff;">บันทึกรหัสผ่านใหม่</button>
        <div id="update-status" style="margin-top: 10px; text-align: center; font-weight: bold;"></div>
    </div>
</div>

<script>
    // URL Backend บน Render ของคุณ
    const BACKEND_URL = "https://freedom-backend-z4az.onrender.com";

    async function adminLogin() {
        const pass = document.getElementById('admin-pass').value;
        const errorDiv = document.getElementById('login-error');

        try {
            let response = await fetch(`${BACKEND_URL}/api/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            });
            
            let data = await response.json();
            if (response.ok) {
                // ซ่อนหน้า login แสดงหน้าแดชบอร์ด
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                
                // แสดงเวลาเข้าสู่ระบบล่าสุด
                if (data.lastLogin) {
                    let thaiDate = new Date(data.lastLogin).toLocaleString('th-TH');
                    document.getElementById('last-login-log').innerText = `🕒 เข้าสู่ระบบล่าสุดเมื่อ: ${thaiDate}`;
                } else {
                    document.getElementById('last-login-log').innerText = `🕒 นี่เป็นการเข้าสู่ระบบครั้งแรกของคุณ`;
                }
            } else {
                errorDiv.innerText = data.error || 'รหัสผ่านไม่ถูกต้อง!';
            }
        } catch (err) {
            errorDiv.innerText = 'ไม่สามารถเชื่อมต่อกับ Server ได้';
            console.error(err);
        }
    }

    async function changePassword() {
        const newPass = document.getElementById('new-admin-pass').value;
        const statusDiv = document.getElementById('update-status');

        if (!newPass) {
            statusDiv.style.color = 'red';
            statusDiv.innerText = 'กรุณากรอกรหัสผ่านใหม่';
            return;
        }

        try {
            let response = await fetch(`${BACKEND_URL}/api/admin/change-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newPassword: newPass })
            });

            let data = await response.json();
            if (response.ok) {
                statusDiv.style.color = 'green';
                statusDiv.innerText = 'เปลี่ยนรหัสผ่านสำเร็จ!';
                document.getElementById('new-admin-pass').value = '';
            } else {
                statusDiv.style.color = 'red';
                statusDiv.innerText = data.error || 'เกิดข้อผิดพลาด';
            }
        } catch (err) {
            statusDiv.style.color = 'red';
            statusDiv.innerText = 'ไม่สามารถเชื่อมต่อ Server ได้';
        }
    }
</script>

</body>
</html>
