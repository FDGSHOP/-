<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREEDOM PLUS - Mod Rental</title>
    <style>
        /* สไตล์หน้าเว็บหลัก โทนเข้มพรีเมียม */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: #121214; color: #fff; min-height: 100vh; position: relative; }
        .navbar { display: flex; padding: 20px 30px; justify-content: space-between; align-items: center; z-index: 10; }
        .logo { font-size: 24px; font-weight: bold; color: #00ffcc; letter-spacing: 2px; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { text-decoration: none; color: #777; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .nav-links a:hover { color: #fff; }
        .auth-btn { background: #00ffcc; color: #121214; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .main-container { display: flex; align-items: center; justify-content: space-around; min-height: 75vh; padding: 20px; }
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); padding: 20px; }
        .modal-content { background: #1a1a1e; margin: 10vh auto; padding: 25px; width: 100%; max-width: 400px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; color: #aaa; font-size: 13px; }
        .form-group input { width: 100%; padding: 10px; background: #25252b; border: 1px solid #444; border-radius: 6px; color: #fff; }
        .submit-btn { background: #00ffcc; color: #121214; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .error-msg { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 10px; }
        .switch-text { text-align: center; font-size: 13px; margin-top: 15px; color: #aaa; cursor: pointer; }
        .switch-text span { color: #00ffcc; text-decoration: underline; }
        .close { position: absolute; right: 20px; top: 15px; font-size: 24px; cursor: pointer; color: #aaa; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">FREEDOM PLUS</div>
        <div class="nav-links">
            <a class="active">หน้าแรก</a>
            <div id="user-auth-area">
                <button class="auth-btn" onclick="openAuthModal('login')">🔑 เข้าสู่ระบบ / สมัครสมาชิก</button>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <h1>ยินดีต้อนรับสู่ระบบเช่า MOD ออนไลน์</h1>
    </div>

    <!-- Auth Modal (เข้าสู่ระบบ / สมัครสมาชิก ในจุดเดียว) -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeAuthModal()">&times;</span>
            <h2 id="auth-title">เข้าสู่ระบบ</h2>
            
            <div class="form-group" style="margin-top: 15px;">
                <label>Username</label>
                <input type="text" id="auth-user" placeholder="กรอกชื่อผู้ใช้">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="auth-pass" placeholder="กรอกรหัสผ่าน">
            </div>
            
            <button class="submit-btn" id="auth-submit-btn" onclick="handleAuthSubmit()">เข้าสู่ระบบ</button>
            <div id="auth-error" class="error-msg"></div>
            
            <div class="switch-text" id="auth-switch" onclick="toggleAuthMode()">
                ยังไม่มีบัญชีใช่ไหม? <span>สมัครสมาชิกที่นี่</span>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://freedom-backend-z4az.onrender.com"; // เปลี่ยนเป็นลิงก์ Render ของคุณ
        let isLoginMode = true;

        function openAuthModal(mode) {
            isLoginMode = (mode === 'login');
            updateAuthModalUI();
            document.getElementById('auth-modal').style.display = 'block';
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('auth-error').innerText = "";
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            updateAuthModalUI();
        }

        function updateAuthModalUI() {
            document.getElementById('auth-title').innerText = isLoginMode ? "เข้าสู่ระบบ" : "สมัครสมาชิก";
            document.getElementById('auth-submit-btn').innerText = isLoginMode ? "เข้าสู่ระบบ" : "ยืนยันการสมัครสมาชิก";
            document.getElementById('auth-switch').innerHTML = isLoginMode ? 
                "ยังไม่มีบัญชีใช่ไหม? <span>สมัครสมาชิกที่นี่</span>" : 
                "มีบัญชีอยู่แล้วใช่ไหม? <span>เข้าสู่ระบบที่นี่</span>";
        }

        async function handleAuthSubmit() {
            const user = document.getElementById('auth-user').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            const errDiv = document.getElementById('auth-error');
            errDiv.innerText = "";

            if (!user || !pass) {
                errDiv.innerText = "กรุณากรอกข้อมูลให้ครบถ้วน";
                return;
            }

            const endpoint = isLoginMode ? `${BACKEND_URL}/api/auth/login` : `${BACKEND_URL}/api/auth/register`;

            try {
                let res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                let data = await res.json();

                if (!res.ok) throw new Error(data.error || "เกิดข้อผิดพลาด");

                if (isLoginMode) {
                    alert(`✅ ยินดีต้อนรับคุณ ${data.user.username}`);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    closeAuthModal();
                    if(data.user.role === 'admin') {
                        window.location.href = "admin.html"; // พาไปหน้าหลังบ้านแอดมิน
                    } else {
                        location.reload();
                    }
                } else {
                    alert("✅ สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ");
                    toggleAuthMode();
                }
            } catch (err) {
                errDiv.innerText = err.message;
            }
        }
    </script>
</body>
</html>
