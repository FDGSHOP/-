<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREEDOM PLUS</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 0; }
        /* หน้าเว็บหลักร้านค้า */
        .shop-container { padding: 40px; text-align: center; }
        h1 { color: #00ffcc; cursor: pointer; user-select: none; display: inline-block; } /* จุดคลิก 5 ครั้งลับ */
        .hero-text { color: #aaa; margin-top: 10px; }
        
        /* กล่องโมดอลทางเข้าแอดมินลับ (ซ่อนอยู่) */
        #secret-admin-modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center; align-items: center;
            z-index: 9999;
        }
        .admin-box {
            background: #1e1e1e; padding: 30px; border-radius: 10px;
            width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,255,204,0.3);
            border: 1px solid #333; position: relative;
        }
        .close-btn {
            position: absolute; top: 10px; right: 15px; background: none; border: none;
            color: #aaa; font-size: 20px; cursor: pointer; width: auto; padding: 0;
        }
        .close-btn:hover { color: #fff; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #ccc; font-size: 14px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; }
        button { background-color: #00ffcc; color: #000; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #00b386; }
        .hidden { display: none; }
        .log-box { background: #2a2a2a; padding: 12px; border-radius: 5px; margin-top: 15px; font-size: 13px; border-left: 4px solid #00ffcc; text-align: left; }
        .error { color: #ff4d4d; text-align: center; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- หน้าเว็บหลักร้านค้าทั่วไป (ปกติ) -->
    <div class="shop-container">
        <!-- คลิกที่คำว่า FREEDOM PLUS ติดต่อกัน 5 ครั้ง เพื่อเปิดหน้าแอดมินลับ -->
        <h1 id="secret-trigger">FREEDOM PLUS</h1>
        <p class="hero-text">ยินดีต้อนรับสู่เว็บไซต์ร้านค้าออนไลน์ บริการเกมและสินค้าดิจิทัลครบวงจร</p>
        <div style="margin-top: 50px; color: #555; font-size: 12px;">© 2026 FREEDOM PLUS. All rights reserved.</div>
    </div>

    <!-- หน้าต่างแอดมินลับ (ซ่อนเป็น Modal มิดชิด) -->
    <div id="secret-admin-modal">
        <div class="admin-box">
            <button class="close-btn" onclick="closeAdminModal()">×</button>
            
            <!-- ส่วนฟอร์มล็อกอิน -->
            <div id="login-section">
                <h2 style="color: #00ffcc; margin-top: 0; text-align: center;">🔒 Admin Portal</h2>
                <div class="form-group">
                    <label>รหัสผ่านแอดมิน</label>
                    <input type="password" id="admin-pass" placeholder="กรอกรหัสผ่าน">
                </div>
                <button onclick="adminLogin()">เข้าสู่ระบบ</button>
                <div id="login-error" class="error"></div>
            </div>

            <!-- ส่วนหลังบ้าน (แสดงหลังล็อกอินผ่านแล้ว) -->
            <div id="admin-dashboard" class="hidden">
                <h2 style="color: #00ffcc; margin-top: 0; text-align: center;">🛠️ จัดการระบบ</h2>
                <div class="log-box" id="last-login-log">
                    กำลังตรวจสอบข้อมูล...
                </div>

                <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">

                <h3 style="font-size: 15px; color: #ddd;">เปลี่ยนรหัสผ่านแอดมิน</h3>
                <div class="form-group">
                    <label>รหัสผ่านใหม่</label>
                    <input type="password" id="new-admin-pass" placeholder="กรอกรหัสผ่านใหม่">
                </div>
                <button onclick="changePassword()" style="background-color: #007bff; color: white;">บันทึกรหัสผ่านใหม่</button>
                <div id="update-status" style="margin-top: 10px; text-align: center; font-size: 14px; font-weight: bold;"></div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://freedom-backend-z4az.onrender.com";

        // ระบบจับจังหวะคลิกโลโก้ 5 ครั้งเพื่อเปิดหน้าแอดมินลับ
        let clickCount = 0;
        let clickTimer = null;
        document.getElementById('secret-trigger').addEventListener('click', () => {
            clickCount++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 1000); // ต้องคลิกภายใน 1 วิ

            if (clickCount >= 5) {
                clickCount = 0;
                document.getElementById('secret-admin-modal').style.display = 'flex';
                document.getElementById('admin-pass').value = '';
                document.getElementById('login-error').innerText = '';
            }
        });

        function closeAdminModal() {
            document.getElementById('secret-admin-modal').style.display = 'none';
            // รีเซ็ตหน้าจอให้กลับเป็นหน้าล็อกอิน
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('admin-dashboard').classList.add('hidden');
        }

        async function adminLogin() {
            const pass = document.getElementById('admin-pass').value;
            const errorDiv = document.getElementById('login-error');
            errorDiv.innerText = '';

            try {
                let response = await fetch(`${BACKEND_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });
                
                let data = await response.json();
                if (response.ok) {
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('admin-dashboard').classList.remove('hidden');
                    
                    if (data.lastLogin) {
                        let thaiDate = new Date(data.lastLogin).toLocaleString('th-TH');
                        document.getElementById('last-login-log').innerText = `🕒 เข้าสู่ระบบล่าสุดเมื่อ: ${thaiDate}`;
                    } else {
                        document.getElementById('last-login-log').innerText = `🕒 นี่เป็นการเข้าสู่ระบบครั้งแรกของคุณ`;
                    }
                } else {
                    errorDiv.innerText = data.error || 'รหัสผ่านไม่ถูกต้อง!';
                }
            } catch (err) {
                errorDiv.innerText = 'ไม่สามารถเชื่อมต่อ Server ได้';
                console.error(err);
            }
        }

        async function changePassword() {
            const newPass = document.getElementById('new-admin-pass').value;
            const statusDiv = document.getElementById('update-status');
            statusDiv.innerText = '';

            if (!newPass) {
                statusDiv.style.color = '#ff4d4d';
                statusDiv.innerText = 'กรุณากรอกรหัสผ่านใหม่';
                return;
            }

            try {
                let response = await fetch(`${BACKEND_URL}/api/admin/change-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newPassword: newPass })
                });

                let data = await response.json();
                if (response.ok) {
                    statusDiv.style.color = '#00ffcc';
                    statusDiv.innerText = 'เปลี่ยนรหัสผ่านสำเร็จ!';
                    document.getElementById('new-admin-pass').value = '';
                } else {
                    statusDiv.style.color = '#ff4d4d';
                    statusDiv.innerText = data.error || 'เกิดข้อผิดพลาด';
                }
            } catch (err) {
                statusDiv.style.color = '#ff4d4d';
                statusDiv.innerText = 'ไม่สามารถเชื่อมต่อ Server ได้';
            }
        }
    </script>
</body>
</html>
